[package]
name = "catcher"
version = "0.32.0"
edition = "2021"
description = "A minimal, local-first markdown notes TUI over plain files"
license = "MIT"
repository = "https://github.com/gautham-v/catcher"
readme = "README.md"
keywords = ["notes", "markdown", "tui", "terminal"]
categories = ["command-line-utilities", "text-editors"]
exclude = ["vendor"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui-image = { version = "9", default-features = false, features = ["crossterm"] }
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
unicode-width = "=0.2.0"
unicode-segmentation = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy", "parsing"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# crossterm drops the mouse's back and forward buttons; this copy passes them
# through (see vendor/crossterm/README.md). Patches don't travel with
# `cargo publish`, so a crates.io install builds without the side buttons.
[patch.crates-io]
crossterm = { path = "vendor/crossterm" }

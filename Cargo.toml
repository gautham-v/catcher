[package]
name = "catcher"
version = "0.14.2"
edition = "2021"
description = "A minimal, local-first markdown notes TUI over plain files"
license = "MIT"
repository = "https://github.com/gautham-v/catcher"
readme = "README.md"
keywords = ["notes", "markdown", "tui", "terminal"]
categories = ["command-line-utilities", "text-editors"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui-image = { version = "9", default-features = false, features = ["crossterm"] }
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
unicode-width = "=0.2.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
